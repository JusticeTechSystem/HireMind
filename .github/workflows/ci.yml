name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hm, POSTGRES_PASSWORD: hm, POSTGRES_DB: hiremind }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hm:hm@localhost:5432/hiremind
      DIRECT_URL: postgresql://hm:hm@localhost:5432/hiremind
      SHADOW_URL: postgresql://hm:hm@localhost:5432/shadow
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec prisma validate && pnpm exec prisma generate
      - name: Committed migrations match the schema (fails on any drift)
        run: |
          PGPASSWORD=hm psql -h localhost -U hm -d hiremind -c 'create database shadow'
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_URL" --exit-code
      - name: Apply migrations and RLS to a real database
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db execute --file prisma/rls.sql --schema prisma/schema.prisma
      - run: node scripts/contrast-check.mjs
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @hiremind/api build
      - run: pnpm --filter @hiremind/web build
      - run: pnpm --filter @hiremind/web lint
      - run: pnpm --filter @hiremind/api test
      - run: pnpm --filter @hiremind/web test
      - run: pnpm audit --prod --audit-level=high
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "./packages/*" build && pnpm --filter @hiremind/web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: axe scan of public pages, dark and light
        run: |
          pnpm --filter @hiremind/web exec vite preview --port 5173 &
          sleep 5
          pnpm exec playwright test tests/e2e/a11y.spec.ts
