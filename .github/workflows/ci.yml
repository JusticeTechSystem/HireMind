name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hm, POSTGRES_PASSWORD: hm, POSTGRES_DB: hiremind }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hm:hm@localhost:5432/hiremind
      DIRECT_URL: postgresql://hm:hm@localhost:5432/hiremind
      SHADOW_URL: postgresql://hm:hm@localhost:5432/shadow
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: bash scripts/ci-step.sh "install" pnpm install --frozen-lockfile=false
      - name: Prisma validate and generate
        run: bash scripts/ci-step.sh "prisma validate-generate" bash -c "pnpm exec prisma validate && pnpm exec prisma generate"
      - name: Committed migrations match the schema
        run: >
          bash scripts/ci-step.sh "migration drift check" bash -c
          'PGPASSWORD=hm psql -h localhost -U hm -d hiremind -c "create database shadow" &&
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_URL" --exit-code'
      - name: Apply migrations and RLS
        run: bash scripts/ci-step.sh "migrate deploy and rls" bash -c "pnpm exec prisma migrate deploy && pnpm exec prisma db execute --file prisma/rls.sql --schema prisma/schema.prisma"
      - name: Contrast check
        run: bash scripts/ci-step.sh "contrast check" node scripts/contrast-check.mjs
      - name: Build shared packages
        run: bash scripts/ci-step.sh "build packages" pnpm --filter "./packages/*" build
      - name: Build API
        run: bash scripts/ci-step.sh "build api" pnpm --filter @hiremind/api build
      - name: Build web
        run: bash scripts/ci-step.sh "build web" pnpm --filter @hiremind/web build
      - name: Lint web (accessibility rules)
        run: bash scripts/ci-step.sh "lint web" pnpm --filter @hiremind/web lint
      - name: API tests
        run: bash scripts/ci-step.sh "api tests" pnpm --filter @hiremind/api test
      - name: Web tests
        run: bash scripts/ci-step.sh "web tests" pnpm --filter @hiremind/web test
      - name: Dependency audit
        # Advisories in transitive dependencies are triaged separately; they are reported as a warning and do not block the build.
        run: WARN_ONLY=1 bash scripts/ci-step.sh "pnpm audit" pnpm audit --prod --audit-level=high
      - name: Fail the job if any step above failed
        if: always()
        run: bash scripts/ci-finish.sh
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: bash scripts/ci-step.sh "install" pnpm install --frozen-lockfile=false
      - name: Build packages and web
        run: bash scripts/ci-step.sh "build for a11y" bash -c 'pnpm --filter "./packages/*" build && pnpm --filter @hiremind/web build'
      - name: Install browser
        run: bash scripts/ci-step.sh "playwright install" pnpm exec playwright install --with-deps chromium
      - name: axe scan of public pages (dark and light)
        # Playwright starts and stops the preview server itself (see playwright.config.ts), so nothing is left running.
        run: PW_WEB_SERVER=1 bash scripts/ci-step.sh "axe scan" pnpm exec playwright test tests/e2e/a11y.spec.ts
      - name: Fail the job if any step above failed
        if: always()
        run: bash scripts/ci-finish.sh
