<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="at ad"><title id="at">HireMind architecture</title><desc id="ad">The React web app talks to the NestJS API over REST and Socket.IO. The API uses PostgreSQL, OpenAI, Stripe and Resend. The browser streams audio directly to OpenAI with a short-lived credential.</desc>
